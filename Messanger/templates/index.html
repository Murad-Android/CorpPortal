<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Катюша мессенджер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="/static/fonts/poppins.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .form-container {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        .toggle-form {
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
        }

        .toggle-form:hover {
            color: white;
            text-decoration: underline;
            cursor: pointer;
        }

        .logo {
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            transition: all 0.3s ease;
            transform: translateY(0);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            transition: all 0.3s ease;
            transform: translateY(0);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="form-container w-full max-w-md p-8 animate__animated animate__fadeIn">
        <!-- Logo and Title -->
        <div class="text-center mb-8">
            <h1 class="logo text-4xl font-bold text-white mb-2">Катюша мессенджер</h1>
            <p class="text-white opacity-80"></p>
        </div>

        <!-- Error Message -->
        <div id="error" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded"></div>

        <!-- Login Form (Active by default) -->
        <form id="loginForm" class="fade-in">
            <h2 class="text-2xl font-semibold text-white mb-6 text-center">Вход в аккаунт</h2>

            <div class="mb-4">
                <input type="text" id="loginUsername" placeholder="Логин"
                    class="input-field w-full px-4 py-3 rounded-lg mb-3 focus:ring-2 focus:ring-white">
            </div>

            <div class="mb-6">
                <input type="password" id="loginPassword" placeholder="Пароль"
                    class="input-field w-full px-4 py-3 rounded-lg mb-3 focus:ring-2 focus:ring-white">
            </div>

            <button type="submit"
                class="btn-primary w-full bg-white text-indigo-600 font-bold py-3 px-4 rounded-lg mb-4">
                Войти
            </button>

            <div class="text-center">
                <span class="text-white opacity-80">Нет аккаунта? </span>
                <span id="showRegister" class="toggle-form font-semibold">Зарегистрироваться</span>
            </div>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="registerForm" class="hidden fade-in">
            <h2 class="text-2xl font-semibold text-white mb-6 text-center">Регистрация</h2>

            <div class="mb-4">
                <input type="text" id="registerUsername" placeholder="Логин"
                    class="input-field w-full px-4 py-3 rounded-lg mb-3 focus:ring-2 focus:ring-white">
            </div>

            <div class="mb-6">
                <input type="password" id="registerPassword" placeholder="Пароль"
                    class="input-field w-full px-4 py-3 rounded-lg mb-3 focus:ring-2 focus:ring-white">
            </div>

            <button type="submit"
                class="btn-secondary w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg mb-4">
                Создать
            </button>

            <div class="text-center">
                <span class="text-white opacity-80">Есть аккаунт? </span>
                <span id="showLogin" class="toggle-form font-semibold">Войти</span>
            </div>
        </form>
    </div>

    <script>
        // DOM Elements
        const errorDiv = document.getElementById('error');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const showRegister = document.getElementById('showRegister');
        const showLogin = document.getElementById('showLogin');

        // Toggle between forms
        showRegister.addEventListener('click', () => {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            registerForm.classList.add('animate__animated', 'animate__fadeIn');
        });

        showLogin.addEventListener('click', () => {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            loginForm.classList.add('animate__animated', 'animate__fadeIn');
        });

        // Login Form Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            // Simple validation
            if (!username || !password) {
                showError('Please fill in all fields');
                return;
            }

            try {
                // Show loading state
                const submitBtn = loginForm.querySelector('button[type="submit"]');
                submitBtn.innerHTML = '<span class="inline-block animate-spin">⏳</span> Signing In...';
                submitBtn.disabled = true;

                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Success - redirect to chat
                    window.location.href = '/chat.html';
                } else {
                    showError(data.message || 'Ошибка входа, проверьте логин и пароль.');
                }
            } catch (error) {
                showError('An error occurred. Please try again.');
                console.error('Login error:', error);
            } finally {
                // Reset button state
                const submitBtn = loginForm.querySelector('button[type="submit"]');
                submitBtn.innerHTML = 'Sign In';
                submitBtn.disabled = false;
            }
        });

        // Register Form Submission
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;

            // Simple validation
            if (!username || !password) {
                showError('Please fill in all fields');
                return;
            }

            if (password.length < 6) {
                showError('Password should be at least 6 characters');
                return;
            }

            try {
                // Show loading state
                const submitBtn = registerForm.querySelector('button[type="submit"]');
                submitBtn.innerHTML = '<span class="inline-block animate-spin">⏳</span> Creating Account...';
                submitBtn.disabled = true;

                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Success - redirect to chat
                    window.location.href = '/chat.html';
                } else {
                    showError(data.message || 'Registration failed. Username might be taken.');
                }
            } catch (error) {
                showError('An error occurred. Please try again.');
                console.error('Registration error:', error);
            } finally {
                // Reset button state
                const submitBtn = registerForm.querySelector('button[type="submit"]');
                submitBtn.innerHTML = 'Sign Up';
                submitBtn.disabled = false;
            }
        });

        // Helper function to show error messages
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            errorDiv.classList.add('animate__animated', 'animate__headShake');

            // Hide error after 5 seconds
            setTimeout(() => {
                errorDiv.classList.add('hidden');
                errorDiv.classList.remove('animate__headShake');
            }, 5000);
        }
    </script>
</body>

</html>
