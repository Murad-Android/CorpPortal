<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Доброе утро!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            background: #0b132b;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #2196F3 0%, #64B5F6 25%, #FFB74D 45%, #1c2541 70%, #0b132b 100%);
            overflow: hidden;
        }

        .hill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 32%;
            background: linear-gradient(to top, #142b12, #2d5428, #5c8a4d);
            clip-path: ellipse(130% 70% at 50% 100%);
            z-index: 5;
        }

        .hill::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, transparent 60%, rgba(255, 183, 77, 0.25));
            clip-path: ellipse(130% 70% at 50% 100%);
        }

        .sun-wrapper {
            position: absolute;
            left: 50%;
            bottom: 12%;
            transform: translateX(-50%);
            z-index: 4;
            animation: rise 6s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }

        .sun {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ffe566 15%, #ffb300 40%, #ff7700 70%, #cc3300 100%);
            box-shadow: 0 0 40px 10px rgba(255, 180, 0, 0.6), 0 0 80px 30px rgba(255, 100, 0, 0.4), inset -10px -15px 30px rgba(180, 50, 0, 0.6);
            animation: pulse 4s ease-in-out infinite alternate;
        }

        .sun::before {
            content: '';
            position: absolute;
            top: 18%;
            left: 22%;
            width: 28%;
            height: 28%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(4px);
        }

        .sun::after {
            content: '';
            position: absolute;
            inset: -40%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 50, 0.4) 0%, transparent 60%);
            filter: blur(25px);
            animation: breathe 5s ease-in-out infinite alternate;
        }

        .message {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(33, 150, 243, 0.6), 0 2px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            letter-spacing: 2px;
            text-align: center;
            z-index: 10;
            animation: fadeIn 2s 2s forwards;
        }

        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe580, transparent 70%);
            opacity: 0;
            animation: float linear infinite;
            pointer-events: none;
        }

        @keyframes rise {
            0% {
                bottom: -15%;
                opacity: 0;
            }

            100% {
                bottom: 28%;
                opacity: 1;
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 40px 10px rgba(255, 180, 0, 0.6), 0 0 80px 30px rgba(255, 100, 0, 0.4), inset -10px -15px 30px rgba(180, 50, 0, 0.6);
            }

            100% {
                box-shadow: 0 0 50px 15px rgba(255, 180, 0, 0.7), 0 0 100px 40px rgba(255, 100, 0, 0.5), inset -10px -15px 30px rgba(180, 50, 0, 0.6);
            }
        }

        @keyframes breathe {
            0% {
                transform: scale(0.95);
                opacity: 0.7;
            }

            100% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-120vh) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <button class="close-btn" onclick="window.portal.closeGreeting()">✕</button>
    <div class="scene" id="scene">
        <div class="sun-wrapper">
            <div class="sun"></div>
        </div>
        <div class="hill"></div>
        <div class="message" id="msg">Доброе утро!</div>
    </div>
    <script>
        // Частицы
        const scene = document.getElementById('scene');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 6 + 3;
            p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}%;bottom:-10%;animation-duration:${Math.random() * 8 + 6}s;animation-delay:${Math.random() * 5}s;`;
            scene.appendChild(p);
        }
        // Имя пользователя
        window.portal.getUserName().then(name => {
            if (name) document.getElementById('msg').textContent = `Доброе утро, ${name}!`;
        });
    </script>
</body>

</html>
