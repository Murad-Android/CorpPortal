<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доброе утро!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; background: #111; font-family: 'Segoe UI', system-ui, sans-serif; }

    .scene {
      position: relative; width: 100%; height: 100%;
      background: linear-gradient(to bottom, #0b132b, #1c2541, #3a506b);
      overflow: hidden;
    }

    /* Холм */
    .hill {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 32%;
      background: linear-gradient(to top, #1e3d1a, #3a6b35, #5c8a4d);
      clip-path: ellipse(130% 70% at 50% 100%);
      z-index: 5;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.6) inset;
    }
    .hill::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.4), transparent 40%);
      clip-path: ellipse(130% 70% at 50% 100%);
    }

    /* Контейнер солнца (для позиционирования за холмом) */
    .sun-wrapper {
      position: absolute; left: 50%; bottom: 15%;
      transform: translateX(-50%);
      z-index: 4;
      animation: rise 6s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    /* 3D Солнце */
    .sun {
      position: relative; width: 130px; height: 130px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ffe566 15%, #ffb300 40%, #ff7700 70%, #cc3300 100%);
      box-shadow: 
        0 0 40px 10px rgba(255, 180, 0, 0.6),
        0 0 80px 30px rgba(255, 100, 0, 0.4),
        0 0 140px 70px rgba(255, 60, 0, 0.2),
        inset -10px -15px 30px rgba(180, 50, 0, 0.6);
      animation: pulse 4s ease-in-out infinite alternate;
    }

    /* Блик (specular) */
    .sun::before {
      content: ''; position: absolute; top: 18%; left: 22%; width: 28%; height: 28%;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
      border-radius: 50%; filter: blur(4px);
    }

    /* Внешнее свечение (корона) */
    .sun::after {
      content: ''; position: absolute; inset: -40%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,200,50,0.4) 0%, transparent 60%);
      filter: blur(25px); animation: breathe 5s ease-in-out infinite alternate;
    }

    /* Лучи */
    .ray {
      position: absolute; top: 50%; left: 50%; width: 6px; height: 160px;
      background: linear-gradient(to top, rgba(255,200,0,0.7), transparent 80%);
      transform-origin: center top; border-radius: 4px; opacity: 0;
      animation: rayFade 4s ease-in-out infinite alternate;
      filter: blur(2px);
    }

    /* Текст */
    .message {
      position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
      font-size: clamp(2rem, 6vw, 4rem); font-weight: 600; color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 40px rgba(255,180,0,0.3);
      opacity: 0; letter-spacing: 2px; text-align: center; z-index: 10;
      animation: fadeIn 2s 3.5s forwards;
    }
    .message span { font-size: 0.6em; vertical-align: middle; margin-right: 8px; }

    /* Анимации */
    @keyframes rise {
      0% { bottom: -15%; opacity: 0; transform: translateX(-50%) scale(0.8); }
      100% { bottom: 22%; opacity: 1; transform: translateX(-50%) scale(1); }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 40px 10px rgba(255, 180, 0, 0.6), 0 0 80px 30px rgba(255, 100, 0, 0.4), inset -10px -15px 30px rgba(180, 50, 0, 0.6); }
      100% { box-shadow: 0 0 50px 15px rgba(255, 180, 0, 0.7), 0 0 100px 40px rgba(255, 100, 0, 0.5), inset -10px -15px 30px rgba(180, 50, 0, 0.6); }
    }
    @keyframes breathe { 0% { transform: scale(0.95); opacity: 0.7; } 100% { transform: scale(1.05); opacity: 1; } }
    @keyframes rayFade { 0% { opacity: 0.3; transform: translateX(-50%) rotate(var(--rot)) scaleY(0.9); } 100% { opacity: 0.85; transform: translateX(-50%) rotate(var(--rot)) scaleY(1.1); } }
    @keyframes fadeIn { to { opacity: 1; } }

    /* Частицы света */
    .particle {
      position: absolute; border-radius: 50%; background: radial-gradient(circle, #ffe580, transparent 70%);
      opacity: 0; animation: float linear infinite; pointer-events: none;
    }
    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-120vh) scale(0.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="sun-wrapper" id="sunWrapper">
      <div class="sun"></div>
    </div>
    <div class="hill"></div>
    <div class="message"><span>☀️</span>Доброе утро!</div>
  </div>

  <script>
    // Генерация лучей
    const sunWrapper = document.getElementById('sunWrapper');
    const rayCount = 24;
    for (let i = 0; i < rayCount; i++) {
      const ray = document.createElement('div');
      ray.className = 'ray';
      const deg = (360 / rayCount) * i;
      ray.style.setProperty('--rot', `${deg}deg`);
      ray.style.transform = `translateX(-50%) rotate(${deg}deg)`;
      ray.style.animationDelay = `${i * 0.15}s`;
      sunWrapper.appendChild(ray);
    }

    // Генерация парящих частиц
    const scene = document.getElementById('scene');
    const particleCount = 40;
    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 6 + 3;
      p.style.width = `${size}px`;
      p.style.height = `${size}px`;
      p.style.left = `${Math.random() * 100}%`;
      p.style.bottom = `-${Math.random() * 20}%`;
      p.style.animationDuration = `${Math.random() * 8 + 6}s`;
      p.style.animationDelay = `${Math.random() * 5}s`;
      scene.appendChild(p);
    }

    // Лёгкий параллакс при движении мыши (для усиления 3D-ощущения)
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 15;
      const y = (e.clientY / window.innerHeight - 0.5) * 10;
      sunWrapper.style.transform = `translateX(calc(-50% + ${x}px)) translateY(${y}px)`;
    });
  </script>
</body>
</html>
