<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добрый день!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; }

    .scene {
      position: relative; width: 100%; height: 100%;
      /* Яркое дневное небо */
      background: linear-gradient(to bottom, 
        #1e90ff 0%, 
        #4fa3d9 35%, 
        #87ceeb 65%, 
        #a8d8ea 100%);
      overflow: hidden;
    }

    /* ☁️ Облака */
    .cloud {
      position: absolute; background: #fff; border-radius: 999px;
      filter: blur(14px); opacity: 0.85; z-index: 2;
    }
    .c1 { width: 240px; height: 70px; top: 12%; left: 10%; animation: drift 22s linear infinite; }
    .c2 { width: 180px; height: 55px; top: 28%; right: 15%; animation: drift 26s linear infinite reverse; }
    .c3 { width: 140px; height: 45px; top: 45%; left: 65%; animation: drift 19s linear infinite; }
    @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }

    /* ☀️ Солнце */
    .sun-wrapper {
      position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
      z-index: 3; animation: floatSun 6s ease-in-out infinite alternate;
    }
    .sun {
      width: 110px; height: 110px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fff8dc 25%, #ffe066 55%, #ffd700 100%);
      box-shadow: 
        0 0 50px 15px rgba(255, 215, 0, 0.5),
        0 0 100px 40px rgba(255, 255, 240, 0.35),
        inset -8px -10px 20px rgba(200, 150, 0, 0.4);
      animation: pulseSun 4s ease-in-out infinite alternate;
    }
    /* Блик */
    .sun::before {
      content: ''; position: absolute; top: 22%; left: 26%; width: 24%; height: 24%;
      background: rgba(255,255,255,0.9); border-radius: 50%; filter: blur(3px);
    }
    /* Корона свечения */
    .sun::after {
      content: ''; position: absolute; inset: -35%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
      filter: blur(20px); animation: breathe 5s ease-in-out infinite alternate;
    }

    /* Лучи */
    .ray {
      position: absolute; top: 50%; left: 50%; width: 4px; height: 110px;
      background: linear-gradient(to bottom, rgba(255,255,220,0.8), transparent 75%);
      transform-origin: center top; border-radius: 4px; filter: blur(2px);
      animation: rayFade 4s ease-in-out infinite alternate;
    }

    /* 🌿 Холм / Земля */
    .hill {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 35%;
      background: linear-gradient(to top, #1b5e20, #388e3c, #66bb6a);
      clip-path: ellipse(140% 65% at 50% 100%);
      z-index: 5;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.15) inset;
    }
    /* Дневная подсветка кроны холма */
    .hill::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, transparent 55%, rgba(255,255,255,0.25));
      clip-path: inherit;
    }

    /* Текст */
    .message {
      position: absolute; top: 48%; left: 50%; transform: translateX(-50%);
      font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 700; color: #fff;
      text-shadow: 0 4px 15px rgba(30, 144, 255, 0.7), 0 2px 8px rgba(0,0,0,0.3);
      opacity: 0; z-index: 10; letter-spacing: 1.5px; text-align: center;
      animation: fadeInText 2s 0.8s forwards;
    }
    .message span { font-size: 0.6em; vertical-align: middle; margin-right: 6px; }

    /* Анимации */
    @keyframes floatSun { 0% { transform: translateX(-50%) translateY(0); } 100% { transform: translateX(-50%) translateY(-10px); } }
    @keyframes pulseSun { 0% { box-shadow: 0 0 50px 15px rgba(255, 215, 0, 0.5), 0 0 100px 40px rgba(255, 255, 240, 0.35), inset -8px -10px 20px rgba(200, 150, 0, 0.4); } 100% { box-shadow: 0 0 60px 20px rgba(255, 215, 0, 0.6), 0 0 120px 50px rgba(255, 255, 240, 0.4), inset -8px -10px 20px rgba(200, 150, 0, 0.4); } }
    @keyframes breathe { 0% { transform: scale(0.92); opacity: 0.6; } 100% { transform: scale(1.08); opacity: 0.95; } }
    @keyframes rayFade { 0% { opacity: 0.4; transform: translateX(-50%) rotate(var(--rot)) scaleY(0.85); } 100% { opacity: 0.9; transform: translateX(-50%) rotate(var(--rot)) scaleY(1.1); } }
    @keyframes fadeInText { to { opacity: 1; } }

    /* Световые частицы (пыль в лучах) */
    .particle {
      position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.8), transparent 70%);
      opacity: 0; animation: floatParticle linear infinite; pointer-events: none;
    }
    @keyframes floatParticle { 0% { transform: translateY(0) scale(1); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.4; } 100% { transform: translateY(-90vh) scale(0.4); opacity: 0; } }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="sun-wrapper" id="sunWrapper"><div class="sun"></div></div>
    <div class="hill"></div>
    <div class="message"><span>☀️</span>Добрый день!</div>
  </div>

  <script>
    // Генерация лучей
    const sunWrapper = document.getElementById('sunWrapper');
    const rayCount = 16;
    for (let i = 0; i < rayCount; i++) {
      const ray = document.createElement('div');
      ray.className = 'ray';
      const deg = (360 / rayCount) * i;
      ray.style.setProperty('--rot', `${deg}deg`);
      ray.style.transform = `translateX(-50%) rotate(${deg}deg)`;
      ray.style.animationDelay = `${i * 0.1}s`;
      sunWrapper.appendChild(ray);
    }

    // Генерация световых частиц
    const scene = document.getElementById('scene');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 2;
      p.style.cssText = `
        width: ${size}px; height: ${size}px;
        left: ${Math.random() * 100}%; bottom: -10%;
        animation-duration: ${Math.random() * 5 + 4}s;
        animation-delay: ${Math.random() * 3}s;
      `;
      scene.appendChild(p);
    }
  </script>
</body>
</html>
