# ==============================================
# Настройки сервера корпоративного портала
# ==============================================

[server]
# IP-адрес для прослушивания
# 0.0.0.0 - все интерфейсы (доступен из сети)
# 127.0.0.1 - только локально
host = 0.0.0.0

# Порт сервера
port = 80

# Количество воркеров (рекомендуется: кол-во ядер CPU * 2 + 1)
workers = 4

# Режим отладки (True/False)
# ВНИМАНИЕ: В продакшене должен быть False!
debug = False

[ssl]
# Включить HTTPS (True/False)
enabled = False

# Путь к SSL сертификату
cert_file = cert/certificate.crt

# Путь к приватному ключу
key_file = cert/private_key.pem

[app]
# Секретный ключ приложения (измените на свой!)
# Можно сгенерировать: python -c "import secrets; print(secrets.token_hex(32))"
secret_key = change-this-secret-key-in-production

# Название компании (отображается в интерфейсе)
company_name = Корпоративный портал

# Максимальный размер загружаемого файла в МБ
max_upload_size_mb = 100
