{% extends "base.html" %}

{% block title %}Смена пароля{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4">
    <div class="mb-6">
        <a href="{{ url_for('profile.index') }}" class="text-blue-500 hover:text-blue-600">
            <i class="fas fa-arrow-left mr-2"></i>Назад к профилю
        </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Смена пароля</h1>

        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Текущий пароль</label>
                <input type="password" name="current_password" required
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Новый пароль</label>
                <input type="password" name="new_password" required minlength="8"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
                <p class="text-xs text-gray-500 mt-1">Минимум 8 символов</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Подтверждение пароля</label>
                <input type="password" name="confirm_password" required
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t">
                <a href="{{ url_for('profile.index') }}"
                    class="px-6 py-2 border border-gray-300 rounded-xl hover:bg-gray-50">Отмена</a>
                <button type="submit" class="px-6 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600">Сменить
                    пароль</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
