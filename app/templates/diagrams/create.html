{% extends "base.html" %}

{% block title %}Новая диаграмма | Корпоративный портал{% endblock %}

{% block content %}
<div class="container mx-auto px-4 max-w-xl">
    <div class="mb-6">
        <a href="{{ url_for('diagrams.index') }}" class="text-blue-500 hover:text-blue-600">
            <i class="fas fa-arrow-left mr-2"></i>Назад к диаграммам
        </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Новая диаграмма</h1>

        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Название</label>
                <input type="text" name="title" placeholder="Моя диаграмма"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Описание</label>
                <textarea name="description" rows="3" placeholder="Краткое описание диаграммы..."
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none resize-none"></textarea>
            </div>

            <div class="flex items-center">
                <input type="checkbox" name="is_public" id="is_public"
                    class="w-4 h-4 text-blue-500 border-gray-300 rounded focus:ring-blue-500">
                <label for="is_public" class="ml-2 text-sm text-gray-700">Публичная диаграмма (видна всем)</label>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t">
                <a href="{{ url_for('diagrams.index') }}"
                    class="px-6 py-2 border border-gray-300 rounded-xl hover:bg-gray-50">
                    Отмена
                </a>
                <button type="submit" class="px-6 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600">
                    <i class="fas fa-plus mr-2"></i>Создать
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
