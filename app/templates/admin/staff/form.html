{% extends "admin/base.html" %}

{% block title %}{{ 'Редактирование' if employee else 'Добавление' }} сотрудника | Админ-панель{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('admin.staff') }}" class="text-blue-500 hover:text-blue-600">
        <i class="fas fa-arrow-left mr-2"></i>Назад к списку
    </a>
</div>

<div class="bg-white rounded-2xl shadow-sm p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
        {{ 'Редактирование сотрудника' if employee else 'Новый сотрудник' }}
    </h1>

    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Photo -->
        <div class="flex items-center space-x-6">
            <div class="shrink-0">
                <img id="photo-preview"
                    src="{{ url_for('static', filename=(employee.photo if employee and employee.photo else '')|user_photo) }}"
                    alt="Фото" class="w-24 h-24 rounded-full object-cover bg-gray-200">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Фото сотрудника</label>
                <input type="file" name="photo" accept="image/*" onchange="previewPhoto(this)"
                    class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Фамилия *</label>
                <input type="text" name="lastname" value="{{ employee.lastname if employee else '' }}" required
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Имя *</label>
                <input type="text" name="firstname" value="{{ employee.firstname if employee else '' }}" required
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Отчество</label>
                <input type="text" name="middlename" value="{{ employee.middlename or '' if employee else '' }}"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Должность</label>
                <input type="text" name="position" value="{{ employee.position if employee else '' }}"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Отдел</label>
                <input type="text" name="department" value="{{ employee.department if employee else '' }}"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input type="email" name="email" value="{{ employee.email if employee else '' }}"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Расположение</label>
                <input type="text" name="location" value="{{ employee.location if employee else '' }}"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Телефон</label>
                <input type="text" name="phone" value="{{ employee.phone if employee else '' }}"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Внутренний телефон</label>
                <input type="text" name="internal_phone" value="{{ employee.internal_phone if employee else '' }}"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Дата рождения</label>
                <input type="date" name="birthday"
                    value="{{ employee.birthday.strftime('%Y-%m-%d') if employee and employee.birthday else '' }}"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Дата приёма</label>
                <input type="date" name="hire_date"
                    value="{{ employee.hire_date.strftime('%Y-%m-%d') if employee and employee.hire_date else '' }}"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
        </div>

        <div class="flex items-center">
            <input type="checkbox" name="is_active" id="is_active" {{ 'checked' if not employee or employee.is_active
                else '' }} class="w-4 h-4 text-blue-500 border-gray-300 rounded focus:ring-blue-500">
            <label for="is_active" class="ml-2 text-sm text-gray-700">Работает в компании</label>
        </div>

        <div class="flex justify-end space-x-4 pt-4 border-t">
            <a href="{{ url_for('admin.staff') }}"
                class="px-6 py-2 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
                Отмена
            </a>
            <button type="submit"
                class="px-6 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600 transition-colors">
                {{ 'Сохранить' if employee else 'Создать' }}
            </button>
        </div>
    </form>
</div>

<script>
    function previewPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('photo-preview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
