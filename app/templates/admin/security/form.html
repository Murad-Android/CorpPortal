{% extends "admin/base.html" %}

{% block title %}{{ 'Редактирование' if article else 'Создание' }} статьи | Админ-панель{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('admin.security') }}" class="text-blue-500 hover:text-blue-600">
        <i class="fas fa-arrow-left mr-2"></i>Назад к списку
    </a>
</div>

<div class="bg-white rounded-2xl shadow-sm p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
        {{ 'Редактирование статьи' if article else 'Новая статья' }}
    </h1>

    <form method="POST" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Заголовок *</label>
            <input type="text" name="title" value="{{ article.title if article else '' }}" required
                class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Краткое описание</label>
            <textarea name="short_description" rows="2"
                class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">{{ article.short_description if article else '' }}</textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Содержание</label>
            <textarea name="content" rows="8"
                class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">{{ article.content if article else '' }}</textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Приоритет</label>
                <select name="priority"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
                    <option value="info" {{ 'selected' if not article or article.priority=='info' else '' }}>Информация
                    </option>
                    <option value="success" {{ 'selected' if article and article.priority=='success' else '' }}>Успех
                    </option>
                    <option value="warning" {{ 'selected' if article and article.priority=='warning' else '' }}>Важный
                    </option>
                    <option value="critical" {{ 'selected' if article and article.priority=='critical' else '' }}>
                        Критический</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Иконка (FontAwesome)</label>
                <input type="text" name="icon" value="{{ article.icon if article else 'shield-alt' }}"
                    placeholder="shield-alt"
                    class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 outline-none">
            </div>
        </div>

        <div class="flex items-center">
            <input type="checkbox" name="is_published" id="is_published" {{ 'checked' if not article or
                article.is_published else '' }}
                class="w-4 h-4 text-blue-500 border-gray-300 rounded focus:ring-blue-500">
            <label for="is_published" class="ml-2 text-sm text-gray-700">Опубликовать</label>
        </div>

        <div class="flex justify-end space-x-4 pt-4 border-t">
            <a href="{{ url_for('admin.security') }}"
                class="px-6 py-2 border border-gray-300 rounded-xl hover:bg-gray-50">Отмена</a>
            <button type="submit" class="px-6 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600">{{ 'Сохранить'
                if article else 'Создать' }}</button>
        </div>
    </form>
</div>
{% endblock %}
