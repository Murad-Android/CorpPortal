{% extends "admin/base.html" %}

{% block title %}Часовой пояс | Админ-панель{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
        <i class="fas fa-clock text-blue-500 mr-2"></i>Часовой пояс
    </h1>

    <div class="bg-white rounded-2xl shadow-sm p-6">
        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Часовой пояс системы</label>
                <select name="timezone"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:border-blue-500 outline-none bg-white text-lg">
                    {% for tz_value, tz_name in timezones %}
                    <option value="{{ tz_value }}" {{ 'selected' if settings.timezone==tz_value else '' }}>
                        {{ tz_name }}
                    </option>
                    {% endfor %}
                </select>
                <p class="text-sm text-gray-500 mt-2">
                    Этот часовой пояс будет использоваться для отображения дат и времени на портале
                </p>
            </div>

            <div class="p-4 bg-blue-50 rounded-xl">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-info-circle text-blue-500 text-xl"></i>
                    <div>
                        <p class="font-medium text-blue-800">Текущее время</p>
                        <p class="text-2xl font-bold text-blue-600" id="currentTime">{{ current_time }}</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-4 border-t">
                <button type="submit" class="px-6 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600">
                    <i class="fas fa-save mr-2"></i>Сохранить
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Обновление времени каждую секунду
    setInterval(function () {
        const now = new Date();
        const options = {
            timeZone: '{{ settings.timezone }}',
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        };
        try {
            document.getElementById('currentTime').textContent = now.toLocaleString('ru-RU', options);
        } catch (e) { }
    }, 1000);
</script>
{% endblock %}
