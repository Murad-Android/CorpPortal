<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ survey.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/inter.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.min.css') }}">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center py-8">
    <div class="container mx-auto px-4 max-w-md text-center">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-eye-slash text-blue-500 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">{{ survey.title }}</h1>
            <p class="text-gray-600">
                Результаты этого опроса скрыты организатором
            </p>
        </div>

        <div class="text-center mt-8 text-sm text-gray-400">
            Корпоративный портал
        </div>
    </div>
</body>

</html>
