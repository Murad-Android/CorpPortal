{% extends "base.html" %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="text-center">
        <div class="text-8xl font-bold text-gray-200 mb-4">404</div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Страница не найдена</h1>
        <p class="text-gray-600 mb-6">Запрашиваемая страница не существует или была удалена</p>
        <a href="{{ url_for('main.index') }}"
            class="inline-flex items-center px-6 py-3 bg-blue-500 text-white rounded-xl hover:bg-blue-600 transition-colors">
            <i class="fas fa-home mr-2"></i>На главную
        </a>
    </div>
</div>
{% endblock %}
