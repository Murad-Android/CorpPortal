{% extends "base.html" %}

{% block title %}{{ table.name }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <a href="{{ url_for('tables.index') }}" class="text-blue-500 hover:text-blue-600 text-sm">
                <i class="fas fa-arrow-left mr-1"></i>Назад
            </a>
            <h1 class="text-2xl font-bold text-gray-800">{{ table.name }}</h1>
        </div>
        <button id="save-btn" class="px-4 py-2 bg-green-500 text-white rounded-xl hover:bg-green-600 hidden">
            <i class="fas fa-save mr-2"></i>Сохранить
        </button>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-4 overflow-x-auto">
        <div id="table-container"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
<script>
    const tableData = {{ table.get_data() | tojson | safe }};
    const canEdit = {{ 'true' if table.owner_id == current_user.id else 'false' }};
    const container = document.getElementById('table-container');
    const firstSheet = Object.values(tableData)[0] || [['', '', '', ''], ['', '', '', '']];

    const hot = new Handsontable(container, {
        data: firstSheet,
        colHeaders: true,
        rowHeaders: true,
        height: 'auto',
        minRows: 10,
        minCols: 8,
        licenseKey: 'non-commercial-and-evaluation',
        readOnly: !canEdit,
        afterChange: function (changes, source) {
            if (source !== 'loadData' && canEdit) {
                document.getElementById('save-btn').classList.remove('hidden');
            }
        }
    });

    document.getElementById('save-btn').addEventListener('click', function () {
        fetch('{{ url_for("tables.save", table_id=table.id) }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token() }}' },
            body: JSON.stringify({ Sheet1: hot.getData() })
        }).then(r => r.json()).then(data => {
            if (data.status === 'success') document.getElementById('save-btn').classList.add('hidden');
        });
    });
</script>
{% endblock %}
