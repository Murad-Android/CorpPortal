{% extends "base.html" %}

{% block title %}Редактирование профиля | Корпоративный портал{% endblock %}

{% block content %}
<div class="container mx-auto px-4 max-w-2xl">
    <a href="{{ url_for('staff.detail', id=employee.id) }}"
        class="inline-flex items-center text-gray-600 hover:text-gray-800 mb-6">
        <i class="fas fa-arrow-left mr-2"></i>Назад к профилю
    </a>

    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <div class="p-6 border-b border-gray-100">
            <h1 class="text-xl font-semibold text-gray-800">Редактирование профиля</h1>
        </div>

        <form method="POST" enctype="multipart/form-data" class="p-6 space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Photo -->
            <div class="flex items-center space-x-6">
                <img src="{{ url_for('static', filename=employee.photo|user_photo) }}" alt="{{ employee.full_name }}"
                    class="w-24 h-24 rounded-full object-cover border-2 border-gray-200">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Фотография</label>
                    <input type="file" name="photo" accept="image/*"
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
            </div>

            <!-- Name fields -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Фамилия</label>
                    <input type="text" name="lastname" value="{{ employee.lastname }}" required
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Имя</label>
                    <input type="text" name="firstname" value="{{ employee.firstname }}" required
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Отчество</label>
                    <input type="text" name="middlename" value="{{ employee.middlename or '' }}"
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
            </div>

            <!-- Position & Department -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Должность</label>
                    <input type="text" name="position" value="{{ employee.position or '' }}"
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Отдел</label>
                    <input type="text" name="department" value="{{ employee.department or '' }}"
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
            </div>

            <!-- Contact -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" name="email" value="{{ employee.email or '' }}"
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Телефон</label>
                    <input type="tel" name="phone" value="{{ employee.phone or '' }}"
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Внутренний телефон</label>
                    <input type="text" name="internal_phone" value="{{ employee.internal_phone or '' }}"
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Местоположение</label>
                    <input type="text" name="location" value="{{ employee.location or '' }}"
                        class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
            </div>

            <!-- Submit -->
            <div class="flex justify-end space-x-3 pt-4">
                <a href="{{ url_for('staff.detail', id=employee.id) }}"
                    class="px-6 py-2 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                    Отмена
                </a>
                <button type="submit"
                    class="px-6 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600 transition-colors">
                    Сохранить
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
