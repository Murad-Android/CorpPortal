{% extends "base.html" %}

{% block title %}Заявка отправлена | Корпоративный портал{% endblock %}

{% block content %}
<div class="container mx-auto px-4 max-w-lg">
    <div class="bg-white rounded-2xl shadow-sm p-8 text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-check text-green-500 text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Заявка отправлена!</h1>
        <p class="text-gray-600 mb-6">Ваша заявка на оформление пропуска успешно отправлена и будет рассмотрена службой
            безопасности.</p>

        <div class="flex flex-col sm:flex-row justify-center gap-3">
            <a href="{{ url_for('requests.pass_request') }}"
                class="px-6 py-3 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                Создать ещё заявку
            </a>
            <a href="{{ url_for('main.index') }}"
                class="px-6 py-3 bg-blue-500 text-white rounded-xl hover:bg-blue-600 transition-colors">
                На главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
