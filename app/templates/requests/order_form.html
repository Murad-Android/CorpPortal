{% extends "base.html" %}

{% block title %}Заказ товаров | Корпоративный портал{% endblock %}

{% block content %}
<div class="container mx-auto px-4 max-w-2xl">
    <a href="{{ url_for('main.index') }}" class="inline-flex items-center text-blue-500 hover:text-blue-600 mb-4">
        <i class="fas fa-arrow-left mr-2"></i>На главную
    </a>

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 flex items-center">
            <i class="fas fa-shopping-cart text-purple-500 mr-3"></i>
            Заказ товаров
        </h1>
        <p class="text-gray-600 mt-1">Заполните форму для заказа необходимых товаров</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <form method="POST" class="p-6 space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Отдел <span class="text-red-500">*</span>
                    </label>
                    <select name="department" required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                        <option value="">Выберите отдел</option>
                        <option value="IT">IT отдел</option>
                        <option value="HR">HR отдел</option>
                        <option value="Финансы">Финансовый отдел</option>
                        <option value="Маркетинг">Маркетинг</option>
                        <option value="Продажи">Отдел продаж</option>
                        <option value="АХО">АХО</option>
                        <option value="Другой">Другой</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Приоритет</label>
                    <select name="priority"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                        <option value="normal">Обычный</option>
                        <option value="high">Высокий</option>
                        <option value="urgent">Срочный</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Наименование товара <span class="text-red-500">*</span>
                </label>
                <input type="text" name="item_name" required placeholder="Введите название товара"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Артикул</label>
                    <input type="text" name="article" placeholder="Артикул товара"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Количество</label>
                    <input type="number" name="quantity" value="1" min="1"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Примечание</label>
                <textarea name="notes" rows="3" placeholder="Дополнительная информация..."
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none resize-none"></textarea>
            </div>

            <button type="submit"
                class="w-full py-4 bg-purple-500 text-white rounded-xl font-semibold hover:bg-purple-600 transition-colors flex items-center justify-center space-x-2">
                <i class="fas fa-paper-plane"></i>
                <span>Отправить заявку</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
